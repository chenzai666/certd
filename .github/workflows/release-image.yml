name: build-image-for-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-certd-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: get_certd_version
        id: get_certd_version
        uses: actions/github-script@v6
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const jsonFilePath = "./packages/ui/certd-server/package.json";
            const jsonContent = fs.readFileSync(jsonFilePath, 'utf-8');
            const pkg = JSON.parse(jsonContent)
            console.log("certd_version:", pkg.version);
            return pkg.version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build all workspace packages
        run: |
          pnpm install
          # Build ALL workspace packages in dependency order
          # This ensures dist/ exists for every workspace dep (lib-server, midway-flyway-js, acme-client, etc.)
          pnpm -r run build
        working-directory: ./

      - name: Override stub packages (ensure our stubs are used)
        run: |
          # Re-build stub packages to ensure they override npm versions
          npx tsc -p packages/libs/plus-core/tsconfig.json
          npx tsc -p packages/libs/commercial-core/tsconfig.json
          npx tsc -p packages/libs/plugin-plus/tsconfig.json
        working-directory: ./

      - name: Build certd-client
        run: |
          npm run build
        working-directory: ./packages/ui/certd-client

      - name: Build certd-server
        run: |
          node ./before-build.js
          pnpm run build-only
          node export-plugin-yaml.js docoff
        working-directory: ./packages/ui/certd-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build default platforms
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          file: ./packages/ui/Dockerfile
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/certd:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/certd:${{ steps.get_certd_version.outputs.result }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_certd_version.outputs.result }}

      - name: Build armv7
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm/v7
          push: true
          context: .
          file: ./packages/ui/Dockerfile
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/certd:armv7
            ${{ secrets.DOCKER_HUB_USERNAME }}/certd:${{ steps.get_certd_version.outputs.result }}-armv7
            ghcr.io/${{ github.repository }}:armv7
            ghcr.io/${{ github.repository }}:${{ steps.get_certd_version.outputs.result }}-armv7
